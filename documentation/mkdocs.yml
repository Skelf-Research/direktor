site_name: Direktor Documentation
site_description: Transform text content into engaging podcast-style videos with AI
site_author: Dipankar Sarkar
repo_url: https://github.com/Skelf-Research/direktor
repo_name: Skelf-Research/direktor

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../direktor]
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - CLI Usage: guide/cli.md
    - Python API: guide/python-api.md
    - Pipeline Stages: guide/pipeline-stages.md
  - API Reference:
    - Overview: api/overview.md
    - audio: api/audio.md
    - video: api/video.md
    - transcript: api/transcript.md
    - images: api/images.md
    - utils: api/utils.md
    - pipeline: api/pipeline.md
    - narrative: api/narrative.md
  - Tutorials:
    - Create Your First Video: tutorials/first-video.md
    - Custom Image Styles: tutorials/custom-images.md
    - Working with Long Content: tutorials/long-content.md
  - Architecture:
    - System Overview: architecture/overview.md
    - Data Flow: architecture/data-flow.md
    - External Dependencies: architecture/dependencies.md
  - Examples:
    - Basic Usage: examples/basic.md
    - Advanced Workflows: examples/advanced.md
  - Contributing: contributing.md
