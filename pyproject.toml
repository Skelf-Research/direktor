[project]
name = "direktor"
version = "0.1.0"
description = "Transform text content into engaging podcast-style videos with synchronized visuals"
authors = [
    {name = "Dipankar Sarkar", email = "me@dipankar.name"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["ai", "video", "podcast", "automation", "content-generation", "text-to-video", "openai", "replicate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.42.0",
    "tiktoken>=0.7.0",
    "tqdm>=4.66.5",
    "halo>=0.0.31",
    "python-dotenv>=1.0.1",
    "replicate>=0.31.0",
    "boto3>=1.35.4",
    "pillow>=10.4.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pytest-cov>=4.1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
direktor = "direktor.cli:main"

[project.urls]
Homepage = "https://github.com/Skelf-Research/direktor"
Repository = "https://github.com/Skelf-Research/direktor"
Documentation = "https://docs.skelfresearch.com/direktor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["direktor"]

[tool.hatch.build.targets.sdist]
include = [
    "direktor/",
    "README.md",
    "LICENSE",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pytest-cov>=4.1.0",
]
