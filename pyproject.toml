[project]
name = "direktor"
version = "0.1.0"
description = "Transform text content into engaging podcast-style videos with synchronized visuals"
authors = [
    {name = "Dipankar Sarkar", email = "me@dipankar.name"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["ai", "video", "podcast", "automation", "content-generation", "text-to-video", "openai", "replicate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.42.0",
    "tiktoken>=0.7.0",
    "tqdm>=4.66.5",
    "halo>=0.0.31",
    "python-dotenv>=1.0.1",
    "replicate>=0.31.0",
    "boto3>=1.35.4",
    "pillow>=10.4.0",
    "requests>=2.31.0",
    "pydantic-settings>=2.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests>=2.31.0",
    "types-tqdm>=4.66.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
direktor = "direktor.cli:main"

[project.urls]
Homepage = "https://github.com/Skelf-Research/direktor"
Repository = "https://github.com/Skelf-Research/direktor"
Documentation = "https://docs.skelfresearch.com/direktor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["direktor"]

[tool.hatch.build.targets.sdist]
include = [
    "direktor/",
    "README.md",
    "LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
exclude = [
    "\\.venv",
    "build",
    "dist",
]
[[tool.mypy.overrides]]
module = [
    "boto3",
    "botocore.*",
    "halo",
    "replicate",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--cov=direktor --cov-report=term-missing --cov-report=xml"
